<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Stream</title>
    <style>
        body {
            text-align: center;
            margin: 0;
            padding: 0;
        }
        iframe {
            width: 100%;
            height: 60vh;
            border: none;
        }
        #playButton {
            display: none; /* Hidden by default */
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <iframe id="streamFrame" 
            src="https://stream.crichd.sc/update/star.php?autoplay=1&mute=1" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
    </iframe>

    <button id="playButton" onclick="playStream()">Play Stream</button>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let iframe = document.getElementById("streamFrame");
            let playButton = document.getElementById("playButton");

            setTimeout(() => {
                try {
                    iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                } catch (error) {
                    console.error("Autoplay blocked or postMessage failed.", error);
                    playButton.style.display = "block"; // Show button if autoplay fails
                }
            }, 2000); // Delay to ensure iframe loads
        });

        function playStream() {
            let iframe = document.getElementById("streamFrame");
            iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        }
    </script>

</body>
</html>
