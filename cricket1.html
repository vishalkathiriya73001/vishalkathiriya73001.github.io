<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<video id="video" controls autoplay width="640" height="360"></video>

<script>
    var video = document.getElementById('video');
    var videoSrc = "https://puc200.mytime1.top:8088/live/webcrichindi/playlist.m3u8?vidictid=201563340145&id=119771&pk=bd0665122c8b610ded4abfa13133103b3483c8ab56c9ca4f8f03dae2fd349997a08c8a6333e4934c0248b2a62dc98251d15a171943eb212156924015b48b7e89";

    if (Hls.isSupported()) {
        var hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play();
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = videoSrc;
        video.addEventListener('loadedmetadata', function() {
            video.play();
        });
    }
</script>

</body>
</html>
