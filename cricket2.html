<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Stream Player (Mobile & Desktop)</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { text-align: center; background-color: #000; }
        video { width: 100%; max-width: 720px; border: 2px solid #fff; }
    </style>
</head>
<body>

    <video id="video" controls autoplay playsinline></video>

    <script>
        var video = document.getElementById('video');
        var videoSrc = "https://jf6.dunyapurkaraja.com:999/hls/star1in.m3u8?md5=I1R4O2GrB4808Cr4w6W91w&expires=1741516879";

        if (Hls.isSupported()) {  
            var hls = new Hls();  
            hls.loadSource(videoSrc);  
            hls.attachMedia(video);  
            hls.on(Hls.Events.MANIFEST_PARSED, function() {  
                video.play();  
            });  
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {  
            video.src = videoSrc;  
            video.addEventListener('loadedmetadata', function() {  
                video.play();  
            });  
        }
    </script>

</body>
</html>
